services:
  - type: web
    name: exam-openstack2026-thuc-hanh
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PASSWORD
        sync: false
      - key: EXAM_TITLE
        value: Bài thi thực hành
      - key: SESSION_NAME
        value: Thực hành HK1 2024
      - key: EXAM_DURATION_MINUTES
        value: 90
      - key: EXAM_FILENAME
        value: de_thi_thuc_hanh.docx
      - key: MAX_UPLOAD_MB
        value: 50
